; PlatformIO project for esp32-morse.
;
; Build and flash:   pio run -t upload
; Serial monitor:    pio device monitor
;
; There is ONE upload step. The app (app/index.html) is compiled into the binary by
; scripts/embed_app.py, so there is no filesystem and no `uploadfs` to forget.

[platformio]
default_envs = esp32s3

[env:esp32s3]
; Exact version, no caret. A caret would admit any 7.x; if the point of pinning is that a
; rebuild in six months produces the same binary, the caret defeats it. 7.1.1 is Arduino
; core 2.0.17 — core 3.x renames APIs this project uses.
platform = espressif32 @ 7.1.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Jinhua #40729 ESP32-S3 N16R8: 16 MB QIO flash + 8 MB octal PSRAM.
; qio_opi is the line that matters — qio_qspi would break the 8 MB PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB

; Set explicitly. The default is a 4 MB layout with ~1.25 MB for the application; the class
; firmware, a bigger program than this one, is 951,728 bytes. Omitting this would surface as
; a link failure later, pointing at nothing. There are 16 MB; spend them.
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB. Without this there is NO serial log.
    -DARDUINO_USB_MODE=1          ; built-in USB-Serial/JTAG, not USB-OTG
    -DBOARD_HAS_PSRAM
    -DFW_VERSION=\"0.1.0\"

lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.12.0
    esp32async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.4.0
    adafruit/Adafruit NeoPixel @ ^1.15.0

; Generates include/app_html.h from ../app/index.html before every build.
extra_scripts = pre:scripts/embed_app.py
